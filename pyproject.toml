[project]
name = "ml"
version = "0.1.0"
description = "Learing ML from basics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.ruff]
target-version = "py314"


[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "I",      # import sorting
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "RUF",    # Ruff-specific
]

[tool.ty.environment]
python-version = "3.14"

[tool.uv]
package = false
